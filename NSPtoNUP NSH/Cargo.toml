[package]
name = "nsh-app-nsptonup"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.1"
nsh-base = "0.5.1"
dirs = "6"
fs4 = "0.13"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
